[project]
name = "razorpay-buildathon-backend"
version = "0.1.0"
description = "Agentic commerce backend — LangGraph orchestrator, guardrails money firewall, MCP server."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "redis>=5.1",
    "qdrant-client>=1.12",
    "razorpay>=1.4",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "rich>=13.9",
    "python-multipart>=0.0.12",
    "mcp>=1.2",
    "groq>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "fakeredis>=2.26",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.guardrails.*"
strict = true

[[tool.mypy.overrides]]
module = "app.agents.checkout"
strict = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
